<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead Style — El Ascenso del Príncipe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Bungee (estilo título de caricatura retro) y Special Elite -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Special+Elite&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3e9d2; /* Fondo pergamino cálido / tono caricatura antigua */
            color: #1a1a1a;
            overflow-x: hidden;
        }
        .font-cartoon { font-family: 'Bungee', cursive; }
        .font-manuscript { font-family: 'Special Elite', monospace; }
        
        /* Estilo de tarjeta de cómic / caricatura con bordes negros gruesos (Inking de los 30s) */
        .cartoon-card {
            background-color: #fffdf9;
            border: 4px solid #1a1a1a;
            box-shadow: 6px 6px 0px #1a1a1a;
            border-radius: 12px;
        }

        .cartoon-btn {
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0px #1a1a1a;
            transition: all 0.1s ease;
        }
        .cartoon-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1a1a1a;
        }

        /* Efecto de grano de película antigua superpuesto */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 0);
            background-size: 4px 4px;
            z-index: 999;
            opacity: 0.6;
        }

        /* Animaciones estilo caricatura clásica: Squash & Stretch */
        @keyframes cartoon-bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-8px) scale(0.97, 1.03); }
        }
        @keyframes dragon-wiggle {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-5px); }
        }
        .animate-cartoon { animation: cartoon-bounce 2.5s ease-in-out infinite; }
        .animate-dragon-toon { animation: dragon-wiggle 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black relative">

    <!-- Capa de grano de película de cine antiguo -->
    <div class="film-grain"></div>

    <!-- ENCABEZADO ESTILO CARTEL DE CARICATURA -->
    <header class="border-b-4 border-black bg-[#fff5d6] sticky top-0 z-50 py-4 px-6 shadow-[0_4px_0_#1a1a1a]">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl animate-bounce">🎬</span>
                <div>
                    <h1 class="font-cartoon text-xl sm:text-2xl text-black tracking-wider uppercase">TOON REGIS</h1>
                    <p class="font-manuscript text-xs font-bold text-zinc-700">A CARTOON EPIC • 90 DAYS TO GLORY</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openPanicModal()" class="cartoon-btn bg-red-400 hover:bg-red-300 text-black px-4 py-2 rounded-lg text-xs font-cartoon tracking-wider uppercase cursor-pointer">
                    ⚠️ Pánico Toon
                </button>
                <button onclick="resetProgress()" class="font-manuscript text-xs font-bold text-zinc-600 hover:text-red-600 cursor-pointer">
                    [ Reiniciar ]
                </button>
            </div>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL -->
    <main class="max-w-5xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- COLUMNA PRINCIPAL -->
        <div class="lg:col-span-2 space-y-6">
            <div class="cartoon-card p-6 relative overflow-hidden bg-amber-50/50">
                
                <!-- ESCENARIO TIPO ANIMACIÓN CLÁSICA (DRAGÓN Y PRÍNCIPE ESTILO 1930s) -->
                <div class="mb-6 bg-[#222] text-white rounded-xl p-5 border-4 border-black relative overflow-hidden flex flex-col sm:flex-row items-center justify-between gap-4 shadow-inner">
                    <!-- Fondo de jefe de nivel estilo Cuphead -->
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] bg-[size:16px_16px]"></div>

                    <!-- DRAGÓN ESTILO CARICATURA RETRO -->
                    <div class="absolute right-6 top-3 animate-dragon-toon pointer-events-none opacity-80">
                        <svg class="w-40 h-28 text-red-500" viewBox="0 0 160 100" fill="currentColor">
                            <!-- Cuerpo y ojos caricaturescos estilo 1930 -->
                            <path d="M20,70 Q50,20 90,50 Q130,10 150,40 Q130,70 90,65 Q60,90 30,80 Z" fill="#e11d48"/>
                            <circle cx="130" cy="30" r="8" fill="white"/>
                            <circle cx="132" cy="30" r="3" fill="black"/>
                            <!-- Fuego clásico de caricatura -->
                            <path d="M150,35 Q170,30 180,40 Q160,50 150,35 Z" fill="#fbbf24"/>
                        </svg>
                    </div>

                    <!-- ESTADO / TÍTULO -->
                    <div class="z-10">
                        <span id="prince-rank" class="font-cartoon text-[10px] uppercase bg-yellow-400 text-black border-2 border-black px-3 py-1 rounded shadow-[2px_2px_0_#000]">Nivel 1</span>
                        <h2 id="prince-title" class="font-cartoon text-xl text-yellow-300 mt-2 drop-shadow-[2px_2px_0_#000]">Viajero Errante</h2>
                        <p id="prince-desc" class="font-manuscript text-xs text-zinc-300 mt-1 max-w-xs">¡Sobreviviendo al asedio del dragón en blanco y negro!</p>
                    </div>

                    <!-- PRÍNCIPE ANIMADO (AVATAR TIPO TOON) -->
                    <div class="z-10 flex flex-col items-center justify-center bg-white text-black border-4 border-black px-6 py-4 rounded-xl animate-cartoon shadow-[4px_4px_0_#000]">
                        <div id="prince-avatar" class="text-4xl mb-1">🎩</div>
                        <span id="prince-level-badge" class="font-cartoon text-[10px] font-bold uppercase">Toon 1</span>
                    </div>
                </div>

                <!-- CONTADOR DE TIEMPO REAL -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-6">
                    <div>
                        <span class="font-manuscript text-xs font-bold uppercase text-zinc-600">Tiempo de Resistencia</span>
                        <h3 class="font-cartoon text-lg text-black">Cronómetro del Show</h3>
                    </div>
                    <div class="text-right bg-white p-4 rounded-xl border-3 border-black shadow-[3px_3px_0_#1a1a1a] min-w-[140px] w-full md:w-auto">
                        <span class="font-manuscript text-[10px] text-zinc-500 block uppercase font-bold">Días de Racha</span>
                        <span id="days-count" class="font-cartoon text-3xl text-amber-600">0</span>
                        <span class="font-manuscript text-[10px] text-zinc-500">/ 90 Días</span>
                    </div>
                </div>

                <!-- BARRA DE PROGRESO RETRO -->
                <div class="space-y-2">
                    <div class="flex justify-between font-manuscript text-xs font-bold text-black">
                        <span>Progreso del Nivel</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="w-full bg-white rounded-full h-4 p-0.5 border-3 border-black shadow-[2px_2px_0_#000]">
                        <div id="progress-bar" class="bg-amber-400 h-2.5 rounded-full transition-all duration-500 border border-black" style="width: 0%"></div>
                    </div>
                </div>

                <!-- CRONÓMETRO -->
                <div class="grid grid-cols-4 gap-2 mt-6 pt-6 border-t-3 border-black text-center">
                    <div class="bg-white p-3 rounded-lg border-2 border-black shadow-[2px_2px_0_#000]">
                        <span id="time-days" class="font
